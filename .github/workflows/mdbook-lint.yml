# Adapted from https://joshrotenberg.com/mdbook-lint/ci-vs-preprocessor.html#integration-approaches

name: mdbook-lint
on:
  push
  pull-request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint Markdown
        uses: joshrotenberg/mdbook-lint-action@v1
        with:
          files: 'book/**/*.md'
          format: sarif
          output-file: results.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif
